<!doctype html>
    <html>

    <head>
        <meta charset="UTF-8">
        <meta name="description" content="BlackJack Game">
        <meta name="keywords" content="HTML,CSS,JavaScript,BlackJack,Game">
        <meta name="author" content="Landon Hatch">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
        <link rel="manifest" href="site.webmanifest">
        <link rel="mask-icon" href="safari-pinned-tab.svg" color="#5bbad5">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="theme-color" content="#ffffff">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="header">
            <h1>BlackJack</h1>
            <h2 id="message-board">Click "Deal" to begin</h2>
        </div>
    <div class="vignette-inset">
        <div class="row table">
            <div class="column side"></div>
            <div class="column middle cards-container">

                <div class="half-height">
                    <div id="dealer-score" class="score">Dealer: 0</div>
                    <div class="spacer"></div>
                    <div id="dealer-cards" class="cards center-content"></div>
                </div>
                <div class="half-height">
                    <div id="player-score" class="score">Player: 0</div>
                    <div class="spacer"></div>
                    <div id="player-cards" class="cards center-content"></div>
                </div>
                
            </div>
            <div class="column side"></div>
        </div>

        <div class="row">
            <div class="column side"></div>
            <div class="column middle center-content">

                <form name="blackjack" onSubmit="newGame(); return false;" action="javascript:void(0);">
                    <button type='submit' id='new-game-button'>Deal</button>
                    <button type="button" id='hit-button' onclick='hit();' disabled>Hit</button>
                    <button type="button" id='stand-button' onclick='stand();' disabled>Stand</button>
                    <br>
                    <br>
                    <div id=player-money></div>
                    <h3>Bet</h3>
                    <div id="bet-value">10</div>
                    <input type="range" min="1" max="100" value="10" class="slider" id="bet">
                </form>
            </div>
            <div class="column side"></div>
        </div>
    </div>

        <div class="footer">
            <p>Designed and Built by Landon Hatch</p>
        </div>


        <script src="scripts.js">
        </script>
    </body>

    </html>
