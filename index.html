<doctype html>
    <html>

    <head>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="header">
            <h1>BlackJack</h1>
        </div>

        <div class="row table">
            <div class="column side"></div>
            <div class="column middle">
                <div id="dealer-cards" class="cards"></div>
                <div id="player-cards" class="cards"></div>
            </div>
            <div class="column side"></div>
        </div>

        <div class="row">
            <div class="column side"></div>
            <div class="column middle">

                <form name="blackjack" onSubmit="newGame(); return false;" action="javascript:void(0);">
                    <input type='submit' id='new-game-button' value='Deal' />
                    <input type='button' id='hit-button' value='Hit' onclick='hit();' disabled />
                    <input type='button' id='stand-button' value='Stand' onclick='stand();' disabled />
                    <br>
                    <br>
                    <div id=player-money></div>
                    Bet:
                    <input type='number' id='bet' value='10' min='1' max="100" />
                </form>
            </div>
            <div class="column middle">
                Score:
                <div id="player-score"></div>
                <div id="dealer-score"></div>
                <br>
                <h2 id="message-board"></h2>
            </div>
            <div class="column side"></div>
        </div>

        <div class="footer">
            <p>Designed and Built by Landon Hatch</p>
        </div>


        <script src="blackJackV2.0.js">
        </script>
    </body>

    </html>
